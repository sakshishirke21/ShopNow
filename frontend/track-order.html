<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Order</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #eaeded;
        color: #0f1111;
      }
      header {
        background: #131921;
        color: #fff;
        padding: 14px 24px;
        border-bottom: 4px solid #232f3e;
      }
      .brand {
        display: inline-block;
        color: #fff;
        text-decoration: none;
        font-size: 1.7rem;
        font-weight: 700;
        letter-spacing: -1px;
      }
      .brand span {
        font-size: 1rem;
      }
      main {
        max-width: 760px;
        margin: 28px auto;
        padding: 0 18px;
      }
      .panel {
        background: #fff;
        border: 1px solid #d5d9d9;
        padding: 24px;
        box-shadow: 0 1px 2px rgba(15, 17, 17, 0.12);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.7rem;
      }
      p {
        margin: 0 0 22px;
        color: #565959;
      }
      .track-row {
        display: flex;
        gap: 10px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 11px 12px;
        border: 1px solid #888c8c;
        border-radius: 4px;
        font-size: 1rem;
      }
      input:focus {
        outline: 3px solid rgba(0, 113, 133, 0.22);
        border-color: #007185;
      }
      button {
        padding: 11px 20px;
        border: 1px solid #fcd200;
        border-radius: 20px;
        background: #ffd814;
        color: #0f1111;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #f7ca00;
      }
      #status {
        margin-top: 22px;
        padding: 16px;
        background: #f7f7f7;
        border: 1px solid #eaeded;
        min-height: 54px;
      }
      @media (max-width: 560px) {
        .track-row {
          flex-direction: column;
        }
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="user.html">ShopNow</a>
    </header>

    <main>
      <section class="panel">
        <h1>Track your order</h1>
        <p>Enter your order ID to see the latest delivery status.</p>
        <div class="track-row">
          <input id="orderId" placeholder="Enter Order ID" />
          <button onclick="trackOrder()">Track package</button>
        </div>
        <h3 id="status"></h3>
      </section>
    </main>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const savedOrderId = localStorage.getItem("lastOrderId");
        if (savedOrderId) {
          document.getElementById("orderId").value = savedOrderId;
          trackOrder();
        }
      });

      async function trackOrder() {
        const id = document.getElementById("orderId").value.trim();
        const token = localStorage.getItem("userToken");

        if (!id) {
          document.getElementById("status").innerText =
            "Please enter an order ID.";
          return;
        }

        try {
          const res = await fetch(`http://localhost:4000/api/orders/${id}`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();

          if (data.success) {
            document.getElementById("status").innerText =
              `Status: ${data.order.status || "Placed"}`;
          } else {
            document.getElementById("status").innerText =
              data.message || "Unable to find order.";
          }
        } catch (error) {
          console.error(error);
          document.getElementById("status").innerText =
            "Unable to track order right now.";
        }
      }
    </script>
  </body>
</html>
