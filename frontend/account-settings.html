<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account Settings - ShopNow</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; background:#eaeded; color:#0f1111; }
  header { background:#131921; color:#fff; padding:14px 24px; border-bottom:4px solid #232f3e; display:flex; justify-content:space-between; align-items:center; }
  .brand { color:#fff; text-decoration:none; font-size:1.7rem; font-weight:700; letter-spacing:-1px; }
  .brand span { font-size:1rem; font-weight:400; margin-left:8px; color:#ddd; }
  a.back { color:#ddd; text-decoration:none; font-size:0.9rem; }
  main { max-width:600px; margin:28px auto; padding:0 18px 60px; }
  .panel { background:#fff; border:1px solid #d5d9d9; border-radius:8px; padding:24px; }
  h1 { margin:0 0 18px; font-size:1.6rem; }
  label { display:block; font-size:0.85rem; font-weight:700; margin:14px 0 5px; }
  input { width:100%; padding:10px; border:1px solid #888c8c; border-radius:4px; font-size:0.95rem; }
  input[disabled] { background:#f0f2f2; color:#565959; }
  button.primary { margin-top:20px; padding:11px 22px; border:1px solid #fcd200; border-radius:20px; background:#ffd814; font-weight:700; cursor:pointer; }
  button.primary:hover { background:#f7ca00; }
  #msg { margin-top:12px; font-size:0.88rem; }
  #msg.ok { color:#1e7b34; }
  #msg.err { color:#c0392b; }
  .note { background:#f0f2f2; border-radius:8px; padding:12px 16px; font-size:0.85rem; color:#565959; margin-top:22px; }
  .signin-note { text-align:center; padding:40px 20px; color:#565959; }
</style>
</head>
<body>
<header>
  <a class="brand" href="user.html">ShopNow<span>Account Settings</span></a>
  <a class="back" href="help.html">Help</a>
</header>
<main>
  <div class="panel" id="panel">Loading&hellip;</div>
</main>
<script>
const API = "http://localhost:5000/api";
const token = localStorage.getItem("userToken");

async function init(){
  const panel = document.getElementById("panel");
  if(!token){
    panel.innerHTML = `<p class="signin-note">Please <a href="login.html">sign in</a> to view your account settings.</p>`;
    return;
  }
  try{
    const res = await fetch(`${API}/me`, { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    const u = data.user || {};
    panel.innerHTML = `
      <h1>Account Settings</h1>
      <label>Full name</label>
      <input id="f-name" value="${u.name || ""}" />
      <label>Email</label>
      <input id="f-email" value="${u.email || ""}" disabled />
      <label>Phone number</label>
      <input id="f-phone" value="${u.phone || ""}" />
      <button class="primary" onclick="save()">Save changes</button>
      <div id="msg"></div>
      <div class="note">Email address and password can't be changed here yet. <a href="contact-us.html">Contact support</a> if you need help with your login.</div>
    `;
  }catch(e){
    console.error(e);
    panel.innerHTML = `<p>Unable to load your account right now.</p>`;
  }
}

async function save(){
  const msg = document.getElementById("msg");
  const name = document.getElementById("f-name").value.trim();
  const phone = document.getElementById("f-phone").value.trim();
  if(!name){ msg.className = "err"; msg.textContent = "Name can't be empty."; return; }
  try{
    const res = await fetch(`${API}/me`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ name, phone })
    });
    const data = await res.json();
    if(data.success){
      localStorage.setItem("user", name);
      msg.className = "ok";
      msg.textContent = "Your account details were updated.";
    }else{
      msg.className = "err";
      msg.textContent = data.message || "Unable to save your changes.";
    }
  }catch(e){
    console.error(e);
    msg.className = "err";
    msg.textContent = "Unable to save your changes right now.";
  }
}

init();
</script>
</body>
</html>
