# Replace shopnow.example.com and the certificate paths before enabling this site.
server {
    listen 80;
    server_name shopnow.example.com www.shopnow.example.com;
    client_max_body_size 15m;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name shopnow.example.com www.shopnow.example.com;
    ssl_certificate /etc/letsencrypt/live/shopnow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopnow.example.com/privkey.pem;
    client_max_body_size 15m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /uploads/ { proxy_pass http://127.0.0.1:5000; expires 7d; add_header Cache-Control "public, immutable"; }
}
